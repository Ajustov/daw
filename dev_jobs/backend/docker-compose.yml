services:
  bd:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-devjobs:/var/lib/postgresql/data
      # Config de \x auto
      - ~/.psqlrc:/root/.psqlrc

volumes:
  postgres-devjobs:
