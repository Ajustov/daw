<!DOCTYPE html>
<html lang="es" class="dark"> <!-- Puedes quitar la clase 'dark' si prefieres el tema claro -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJobs - Backend Server</title>

    <!-- Tailwind CSS Engine -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <style>
        /* Variables tomadas directamente de tu CSS de Frontend */
        :root {
            --radius: 0.625rem;
            --background: #ccc9c5;
            --foreground: #1c1917;
            --card: #bebbb7;
            --card-foreground: #1c1917;
            --primary: #2563eb;
            --primary-foreground: #ffffff;
            --secondary: #a8a5a1;
            --secondary-foreground: #1c1917;
            --border: rgba(0, 0, 0, 0.12);
        }

        .dark {
            --background: #111111;
            --foreground: #f3f4f6;
            --card: #18181b;
            --card-foreground: #f3f4f6;
            --primary: #3b82f6;
            --primary-foreground: #ffffff;
            --secondary: #27272a;
            --secondary-foreground: #a1a1aa;
            --border: #27272a;
        }

        /* Estilos base */
        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        ::selection {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .custom-card {
            background-color: var(--card);
            color: var(--card-foreground);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border-radius: var(--radius);
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--secondary-foreground);
            border-radius: var(--radius);
            transition: opacity 0.2s;
        }

        .btn-secondary:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="custom-card max-w-md w-full p-6 shadow-xl text-center flex flex-col items-center">
        <!-- Indicador de Estado API -->
        <div class="flex items-center gap-2 mb-4">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            <span class="text-xs font-mono uppercase tracking-widest opacity-70">Backend Activo</span>
        </div>

        <!-- Título -->
        <h1 class="text-2xl font-bold mb-2">DevJobs API Engine</h1>
        <p class="text-sm opacity-80 mb-6">
            Servidor Django en ejecución. Selecciona la sección a la que deseas dirigirte en el Frontend:
        </p>

        <!-- Enlaces al Frontend -->
        <div class="w-full flex flex-col gap-3">
            <a href="http://localhost:5173/" 
               class="btn-primary py-2.5 px-4 font-medium text-sm flex items-center justify-center gap-2 shadow-sm">
                <span>Ir al Frontend (Inicio)</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>

            <a href="http://localhost:5173/offers" 
               class="btn-secondary py-2.5 px-4 font-medium text-sm flex items-center justify-center border border-[var(--border)]">
                Ver Empleos
            </a>

            <a href="http://localhost:5173/offers" 
               class="btn-secondary py-2.5 px-4 font-medium text-sm flex items-center justify-center border border-[var(--border)]">
                Panel Admin / Dashboard
            </a>
        </div>
    </div>

</body>
</html>
